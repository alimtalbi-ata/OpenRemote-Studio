<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img" aria-labelledby="title desc">
<title id="title">R119 — validation known_hosts fail-closed</title>
<desc id="desc">Le parseur valide les champs d'hôte hashés OpenSSH version 1 ou les formes DNS/IP/IPv6, puis l'ACL et OpenSSH strict maintiennent la frontière de confiance.</desc>
<rect width="1160" height="440" rx="18" fill="#f5f7fb"/>
<text x="40" y="44" font-family="Segoe UI,Arial" font-size="23" font-weight="700" fill="#14243a">R119 — Validation stricte du champ host de known_hosts</text>
<g font-family="Segoe UI,Arial" font-size="15" fill="#14243a" stroke="#9aa9bd" stroke-width="1.5">
<rect x="35" y="90" width="190" height="86" rx="12" fill="#ffffff"/><text x="130" y="121" text-anchor="middle" stroke="none" font-weight="700">Fichier choisi</text><text x="130" y="145" text-anchor="middle" stroke="none">Octets inchangés</text>
<path d="M225 133 H260" fill="none"/><path d="M252 126 L260 133 L252 140" fill="none"/>
<rect x="260" y="90" width="260" height="86" rx="12" fill="#e7f1ff"/><text x="390" y="119" text-anchor="middle" stroke="none" font-weight="700">Validation du champ hôte</text><text x="390" y="143" text-anchor="middle" stroke="none">Hash v1 / DNS / IPv4 / IPv6</text>
<path d="M520 133 H555" fill="none"/><path d="M547 126 L555 133 L547 140" fill="none"/>
<rect x="555" y="90" width="250" height="86" rx="12" fill="#e7f7ed"/><text x="680" y="119" text-anchor="middle" stroke="none" font-weight="700">Contrôles de confiance</text><text x="680" y="143" text-anchor="middle" stroke="none">ACL + staging privé</text>
<path d="M805 133 H840" fill="none"/><path d="M832 126 L840 133 L832 140" fill="none"/>
<rect x="840" y="90" width="280" height="86" rx="12" fill="#e7f7ed"/><text x="980" y="119" text-anchor="middle" stroke="none" font-weight="700">Client OpenSSH</text><text x="980" y="143" text-anchor="middle" stroke="none">StrictHostKeyChecking</text>
<path d="M390 176 V230 H285 V260" fill="none" stroke="#b45353"/><path d="M278 252 L285 260 L292 252" fill="none" stroke="#b45353"/>
<rect x="145" y="260" width="280" height="70" rx="12" fill="#fff0f0" stroke="#b45353"/><text x="285" y="288" text-anchor="middle" stroke="none" font-weight="700" fill="#8f3030">Refus immédiat</text><text x="285" y="311" text-anchor="middle" stroke="none" fill="#8f3030">Format inconnu / port invalide</text>
<rect x="555" y="260" width="565" height="70" rx="12" fill="#ffffff"/><text x="837" y="289" text-anchor="middle" stroke="none" font-weight="700">Aucun wildcard ou nouvel hôte accepté automatiquement</text><text x="837" y="312" text-anchor="middle" stroke="none">Aucun secret journalisé ; pas de connexion de production dans les tests</text>
</g>
<text x="40" y="400" font-family="Segoe UI,Arial" font-size="14" fill="#52637a">Tests : ssh-keygen -H local réel + tests de formats invalides • Ansible externe : non qualifié (UNVERIFIED)</text>
</svg>
