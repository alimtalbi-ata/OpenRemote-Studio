<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">R121 — binding obligatoire du consentement Ansible</title>
  <desc id="desc">Le consentement est lié aux empreintes SHA-256 canoniques du playbook, de l'inventaire, de known_hosts et de la clé SSH. Le runner compare les fichiers relus avant staging et lancement. Une empreinte absente ou différente provoque un refus sans lancement du processus.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#365f91"/></marker>
    <style>
      .title {font:700 25px sans-serif; fill:#17324d}
      .sub {font:14px sans-serif; fill:#40566d}
      .head {font:700 16px sans-serif; fill:#17324d}
      .body {font:13px sans-serif; fill:#243746}
      .small {font:12px sans-serif; fill:#40566d}
      .box {fill:#f3f7fc;stroke:#7090b1;stroke-width:1.8;rx:12}
      .safe {fill:#edf8f0;stroke:#4c8b62;stroke-width:1.8;rx:12}
      .deny {fill:#fff1ed;stroke:#b95e4e;stroke-width:1.8;rx:12}
      .line {fill:none;stroke:#365f91;stroke-width:2.2;marker-end:url(#arrow)}
      .redline {fill:none;stroke:#b95e4e;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="600" fill="#ffffff"/>
  <text x="36" y="44" class="title">R121 — consentement Ansible lié aux octets approuvés</text>
  <text x="36" y="70" class="sub">Défense backend : consent=True seul ne suffit plus à démarrer le runner.</text>

  <rect x="36" y="112" width="300" height="196" class="box"/>
  <text x="56" y="144" class="head">1. Fichiers approuvés</text>
  <text x="56" y="174" class="body">• Playbook SHA-256</text>
  <text x="56" y="200" class="body">• Inventaire SHA-256</text>
  <text x="56" y="226" class="body">• known_hosts SHA-256</text>
  <text x="56" y="252" class="body">• Clé SSH SHA-256</text>
  <text x="56" y="282" class="small">Hex minuscule, 64 caractères chacun</text>

  <rect x="405" y="112" width="302" height="196" class="safe"/>
  <text x="425" y="144" class="head">2. Barrière du runner</text>
  <text x="425" y="174" class="body">Validation du format des 4 empreintes</text>
  <text x="425" y="200" class="body">Comparaison aux octets relus</text>
  <text x="425" y="226" class="body">Refus des entrées modifiées</text>
  <text x="425" y="258" class="small">Avant le staging et tout processus</text>
  <text x="425" y="280" class="small">Aucune sortie enfant conservée</text>

  <rect x="776" y="112" width="306" height="124" class="safe"/>
  <text x="796" y="144" class="head">3. Entrées identiques</text>
  <text x="796" y="174" class="body">Staging privé vérifié (DACL / modes)</text>
  <text x="796" y="200" class="body">SSH strict, identité isolée, timeout</text>

  <rect x="776" y="280" width="306" height="124" class="deny"/>
  <text x="796" y="312" class="head">Refus fail-closed</text>
  <text x="796" y="342" class="body">Empreinte absente ou malformée</text>
  <text x="796" y="368" class="body">ou octets différents → aucun spawn</text>

  <path d="M336 210 H397" class="line"/>
  <path d="M707 166 H768" class="line"/>
  <path d="M556 308 V340 H768" class="redline"/>
  <text x="38" y="456" class="head">Erreurs stables et sans secret</text>
  <rect x="36" y="475" width="510" height="78" class="deny"/>
  <text x="56" y="505" class="body">empreinte manquante / format invalide</text>
  <text x="56" y="529" class="small">ansible_approval_fingerprints_required</text>
  <rect x="574" y="475" width="508" height="78" class="box"/>
  <text x="594" y="505" class="body">Entrées modifiées depuis l'analyse ou l'approbation</text>
  <text x="594" y="529" class="small">re-analyse playbook/inventaire ou re-approbation trust/key</text>
</svg>
