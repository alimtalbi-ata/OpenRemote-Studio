<g font-family="Arial,sans-serif" font-size="14" fill="#34495e"><text x="42" y="260">Vert : adaptateur local. Pointillé : session WinRM réelle encore UNVERIFIED.</text><text x="42" y="287">Le contrôle du binaire n'ouvre aucun socket et ne résout aucun secret.</text></g>
