<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">OpenRemote Studio R118 — frontière de confiance du runner Ansible</title>
  <desc id="desc">Diagramme conceptuel des fichiers directement protégés par DACL, de l'identité SSH imposée et des deux contrôles de processus.</desc>
  <rect width="1200" height="690" fill="#f5f7fb"/>
  <text x="48" y="52" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#17324d">R118 — Runner Ansible : frontière de confiance</text>
  <text x="48" y="82" font-family="Segoe UI,Arial" font-size="15" fill="#536477">Diagramme conceptuel • aucune capture UI ni connexion Ansible réelle</text>
  <rect x="40" y="116" width="1120" height="290" rx="18" fill="#e9f2ff" stroke="#3267a8" stroke-width="2"/>
  <text x="66" y="151" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#174b82">Racine temporaire vérifiée — DACL : compte courant + SYSTEM uniquement</text>
  <g font-family="Segoe UI,Arial" font-size="15" fill="#17324d">
    <rect x="66" y="177" width="245" height="55" rx="9" fill="#ffffff" stroke="#8aa8ca"/>
    <text x="188" y="200" text-anchor="middle" font-weight="600">playbook.yml + inventory.ini</text>
    <text x="188" y="219" text-anchor="middle" font-size="12">instantanés analysés / empreintes</text>
    <rect x="335" y="177" width="245" height="55" rx="9" fill="#ffffff" stroke="#8aa8ca"/>
    <text x="457" y="200" text-anchor="middle" font-weight="600">id_key + known_hosts</text>
    <text x="457" y="219" text-anchor="middle" font-size="12">clé et épinglage explicites</text>
    <rect x="604" y="177" width="245" height="55" rx="9" fill="#ffffff" stroke="#8aa8ca"/>
    <text x="726" y="200" text-anchor="middle" font-weight="600">empty_known_hosts</text>
    <text x="726" y="219" text-anchor="middle" font-size="12">aucune confiance globale héritée</text>
    <rect x="873" y="177" width="245" height="55" rx="9" fill="#ffffff" stroke="#8aa8ca"/>
    <text x="995" y="200" text-anchor="middle" font-weight="600">empty_config + ansible.cfg</text>
    <text x="995" y="219" text-anchor="middle" font-size="12">configurations isolées du profil</text>
  </g>
  <path d="M188 246 V274 H995 V246" fill="none" stroke="#3267a8" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="180" y="276" width="840" height="53" rx="10" fill="#d8e9ff" stroke="#3267a8"/>
  <text x="600" y="299" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#174b82">Contrôle DACL de tous les fichiers avant chaque lancement</text>
  <text x="600" y="318" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#174b82">après staging • avant syntax-check • avant check/diff</text>
  <path d="M600 330 V357" stroke="#3267a8" stroke-width="2.5"/>
  <path d="M592 349 L600 359 L608 349" fill="none" stroke="#3267a8" stroke-width="2.5"/>
  <rect x="40" y="426" width="1120" height="104" rx="15" fill="#e8f7ef" stroke="#2e8b57" stroke-width="2"/>
  <text x="66" y="458" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#17613a">Options SSH forcées</text>
  <text x="66" y="487" font-family="Consolas,monospace" font-size="16" fill="#174b82">StrictHostKeyChecking=yes • PreferredAuthentications=publickey</text>
  <text x="66" y="512" font-family="Consolas,monospace" font-size="16" fill="#174b82">IdentitiesOnly=yes • IdentityAgent=none • ProxyCommand=none • ForwardAgent=no</text>
  <path d="M600 532 V553" stroke="#3267a8" stroke-width="2.5"/>
  <path d="M592 546 L600 556 L608 546" fill="none" stroke="#3267a8" stroke-width="2.5"/>
  <g font-family="Segoe UI,Arial" fill="#17324d">
    <rect x="92" y="562" width="430" height="61" rx="11" fill="#ffffff" stroke="#8aa8ca" stroke-width="2"/>
    <text x="307" y="587" text-anchor="middle" font-size="17" font-weight="700">1. ansible-playbook --syntax-check</text>
    <text x="307" y="608" text-anchor="middle" font-size="13">stdout/stderr abandonnés • timeout commun</text>
    <rect x="678" y="562" width="430" height="61" rx="11" fill="#ffffff" stroke="#8aa8ca" stroke-width="2"/>
    <text x="893" y="587" text-anchor="middle" font-size="17" font-weight="700">2. ansible-playbook --check --diff</text>
    <text x="893" y="608" text-anchor="middle" font-size="13">nouvelle vérification ACL avant lancement</text>
  </g>
  <text x="600" y="660" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#8b3d26">Limite : --check n'est pas un sandbox ; cible Ansible réelle non qualifiée (UNVERIFIED).</text>
</svg>
