<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
  <title id="title">R130 — expurgation des clés de secrets préfixées</title>
  <desc id="desc">Un texte de diagnostic est borné, les noms de variables composés sont analysés, les valeurs sensibles sont masquées, puis les protections R128 et R129 s'appliquent avant l'export structuré.</desc>
  <rect width="1080" height="340" rx="18" fill="#f7f9fc"/>
  <text x="32" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#20304a">R130 — frontière de confidentialité de l'export</text>
  <text x="32" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#52637a">Diagramme conceptuel — aucune capture UI n'est revendiquée</text>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#20304a" stroke-linejoin="round">
    <rect x="28" y="112" width="205" height="116" rx="12" fill="#fff" stroke="#8ca0b8" stroke-width="1.5"/>
    <text x="130" y="141" text-anchor="middle" font-size="15" font-weight="700">Entrée bornée</text>
    <text x="130" y="166" text-anchor="middle" font-size="12">GITHUB_TOKEN=…</text>
    <text x="130" y="187" text-anchor="middle" font-size="12">AZURE_CLIENT_SECRET=…</text>
    <text x="130" y="208" text-anchor="middle" font-size="12">DATABASE_URL=…</text>
    <path d="M233 170 H263" stroke="#64748b" stroke-width="2.5" fill="none"/>
    <path d="M255 162 L263 170 L255 178" stroke="#64748b" stroke-width="2.5" fill="none"/>
    <rect x="266" y="112" width="230" height="116" rx="12" fill="#fff" stroke="#4b83b8" stroke-width="1.8"/>
    <text x="381" y="141" text-anchor="middle" font-size="15" font-weight="700">Reconnaissance du nom</text>
    <text x="381" y="166" text-anchor="middle" font-size="12">Préfixes + composants</text>
    <text x="381" y="187" text-anchor="middle" font-size="12">Valeurs citées / JSON</text>
    <text x="381" y="208" text-anchor="middle" font-size="12">Sans coercition d'objet</text>
    <path d="M496 170 H526" stroke="#64748b" stroke-width="2.5" fill="none"/>
    <path d="M518 162 L526 170 L518 178" stroke="#64748b" stroke-width="2.5" fill="none"/>
    <rect x="529" y="112" width="230" height="116" rx="12" fill="#fff" stroke="#2c8a70" stroke-width="1.8"/>
    <text x="644" y="141" text-anchor="middle" font-size="15" font-weight="700">Expurgation ciblée</text>
    <text x="644" y="166" text-anchor="middle" font-size="12">Valeur → [REDACTED]</text>
    <text x="644" y="187" text-anchor="middle" font-size="12">Contexte utile conservé</text>
    <text x="644" y="208" text-anchor="middle" font-size="12">Noms non sensibles intacts</text>
    <path d="M759 170 H789" stroke="#64748b" stroke-width="2.5" fill="none"/>
    <path d="M781 162 L789 170 L781 178" stroke="#64748b" stroke-width="2.5" fill="none"/>
    <rect x="792" y="112" width="260" height="116" rx="12" fill="#fff" stroke="#8ca0b8" stroke-width="1.5"/>
    <text x="922" y="141" text-anchor="middle" font-size="15" font-weight="700">Protections R128 / R129</text>
    <text x="922" y="166" text-anchor="middle" font-size="12">JWT, cookies, URL</text>
    <text x="922" y="187" text-anchor="middle" font-size="12">Blocs PEM / PGP</text>
    <text x="922" y="208" text-anchor="middle" font-size="12">Schéma incidents v1</text>
  </g>
  <text x="32" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#52637a">Les tests utilisent uniquement des sentinelles synthétiques. Cette protection n'est pas un détecteur universel de secrets.</text>
  <text x="32" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#52637a">Auteur : Abdelhalim Talbi • V31.8 R130 • 27 octobre 2026</text>
</svg>
