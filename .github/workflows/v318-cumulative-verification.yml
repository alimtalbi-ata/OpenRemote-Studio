name: V31.8 cumulative verification
on:
  push:
    branches: [develop/v31.8-windows-ci, feature/v31.8-r87-manual-ssh-retry, feature/v31.8-r89-ssh-failure-guidance-live-retry, feature/v31.8-r90-ssh-consent-binding-live-qt, feature/v31.8-r91-consent-revocation, feature/v31.8-r92-bounded-ssh-probe, feature/v31.8-r93-winrm-readonly-inventory, feature/v31.8-r94-winrm-timeout-qt-preview, feature/v31.8-r95-winrm-services-readonly, feature/v31.8-r97-winrm-service-precise-count, feature/v31.8-r98-winrm-service-drift, feature/v31.8-r99-winrm-wincred-reference, feature/v31.8-r100-wincred-native-boundaries, feature/v31.8-r101-winrm-packaged-runtime, feature/v31.8-r102-winrm-strict-response, feature/v31.8-r103-winrm-exception-boundaries, feature/v31.8-r104-winrm-display-trust, feature/v31.8-r105-winrm-enterprise-ca, feature/v31.8-r106-winrm-ca-pinning, feature/v31.8-r107-winrm-ca-snapshot, feature/v31.8-r108-winrm-ca-acl, feature/v31.8-r109-zabbix-readonly-alerts, feature/v31.8-r110-zabbix-origin-consent, feature/v31.8-r111-zabbix-response-deadline, feature/v31.8-r112-zabbix-transaction-deadline, feature/v31.8-r113-bounded-dns-deadline]
  pull_request:
    branches: [main, develop/v31.8-windows-ci, feature/v31.8-r71-resume-lock-ownership, feature/v31.8-r72-tunnel-lifecycle-audit, feature/v31.8-r73-netbox-readonly, feature/v31.8-r74-netbox-qt-preview, feature/v31.8-r75-netbox-local-filter, feature/v31.8-r76-netbox-revocation, feature/v31.8-r77-openssh-hostkey-validation, feature/v31.8-r78-tunnel-active-revocation, feature/v31.8-r79-tunnel-close-barrier, feature/v31.8-r80-tunnel-drain-hostkey-rotation, feature/v31.8-r81-tunnel-ui-shutdown, feature/v31.8-r82-qt-tunnel-panel, feature/v31.8-r83-ssh-link-health, feature/v31.8-r86-qt-ssh-keepalive, feature/v31.8-r87-manual-ssh-retry, feature/v31.8-r88-qt-font-render-gate, feature/v31.8-r89-ssh-failure-guidance-live-retry, feature/v31.8-r91-consent-revocation, feature/v31.8-r92-bounded-ssh-probe, feature/v31.8-r93-winrm-readonly-inventory, feature/v31.8-r95-winrm-services-readonly, feature/v31.8-r96-winrm-services-qt-filter, feature/v31.8-r97-winrm-service-precise-count, feature/v31.8-r98-winrm-service-drift, feature/v31.8-r99-winrm-wincred-reference, feature/v31.8-r100-wincred-native-boundaries, feature/v31.8-r109-zabbix-readonly-alerts, feature/v31.8-r105-winrm-enterprise-ca, feature/v31.8-r107-winrm-ca-snapshot, feature/v31.8-r108-winrm-ca-acl, feature/v31.8-r110-zabbix-origin-consent, feature/v31.8-r111-zabbix-response-deadline, feature/v31.8-r112-zabbix-transaction-deadline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-verifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R70 exact source and packaging regression
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Wrong checkout SHA: $actual != $expected" }
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_packaging_spec_paths_r70.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce canonical release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -ne '31.8') { throw "Expected VERSION.txt=31.8, got '$version'" }
      - name: Run archive verifier regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s 04-Tests-et-Qualification -p test_verify_cumulative_v318.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile critical SFTP sources and run cancellation regressions
        shell: pwsh
        run: |
          python -m py_compile Application/transfer_safety.py Application/qt_workers.py Application/tests/test_upload_cancellation_v318.py Application/tests/test_resume_cancellation_v318.py Application/tests/test_atomic_download_v318.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_*cancellation_v318.py' -v
          python -m unittest discover -s Application/tests -p 'test_atomic_download_v318.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_resume_lock_ownership_r71.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_ssh_identity_r77.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_lifecycle_r72.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_revocation_r78.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_close_barrier_r79.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_drain_r80.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_shutdown_r81.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_controller_r82.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_health_r83.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_watchdog_r84.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_netbox_readonly_r73.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_netbox_preview_r74.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_netbox_filter_r75.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_netbox_cancel_r76.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile Application/netbox_readonly.py Application/netbox_preview_filter.py Application/netbox_preview_qt.py Application/qt_app.py Application/tests/test_netbox_cancel_r76.py Application/tests/test_netbox_cancel_qt_r76.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R93 WinRM read-only offline and redaction regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_readonly_r93.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R93 WinRM unit gate failed" }
          python -m py_compile Application/winrm_readonly.py Application/tests/test_winrm_readonly_r93.py
          if ($LASTEXITCODE -ne 0) { throw "R93 WinRM source compile failed" }
      - name: R94 WinRM timeout and Qt source gate
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_timeout_r94.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R94 WinRM timeout contract failed" }
          python -m unittest discover -s Application/tests -p 'test_network_scope_empty_close_r94.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R94 empty-scope shutdown regression failed" }
          python -m py_compile Application/winrm_inventory_qt.py Application/tests/test_winrm_inventory_qt_r94.py Application/qt_app.py
          if ($LASTEXITCODE -ne 0) { throw "R94 WinRM Qt compilation failed" }
      - name: R92 bounded probe regression before Windows packaging
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application;Application/tests'
          python -m unittest discover -s Application/tests -p 'test_tunnel_probe_r92.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R92 bounded SSH probe failed" }
          python -m py_compile Application/tunnel_controller.py Application/ssh_tunnel_qt.py Application/tests/test_tunnel_probe_qt_r92.py
          if ($LASTEXITCODE -ne 0) { throw "R92 source compilation failed" }
      - name: R90 consent guard source and tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m py_compile Application/ssh_consent_guard.py Application/ssh_tunnel_qt.py Application/tests/test_ssh_consent_qt_r90.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_ssh_consent_guard_r90.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R98 local-only WinRM service drift contract
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_service_drift_r98.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R98 drift contract failed" }
          python -m py_compile Application/winrm_service_drift.py Application/winrm_inventory_qt.py
          if ($LASTEXITCODE -ne 0) { throw "R98 source compilation failed" }
      - name: R99 WinCred strict reference and secret redaction contract
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_credential_ref_r99.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R99 WinCred contract failed" }
          python -m py_compile Application/winrm_credential_ref.py Application/winrm_inventory_qt.py
          if ($LASTEXITCODE -ne 0) { throw "R99 source compilation failed" }
      - name: R101 packaged WinRM runtime and spec path regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_runtime_r101.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R101 packaged runtime contract failed" }
      - name: R102 strict WinRM reply contract
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_response_r102.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R102 strict WinRM response contract failed" }
      - name: R103 WinRM hostile exception and Qt signal boundary
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_exception_boundary*r103.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R103 WinRM boundary failed' }
      - name: R104 WinRM display trust, OS/disks and services (offline)
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_display_trust_r104.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R104 WinRM display trust failed' }
          python -m py_compile Application/winrm_readonly.py Application/winrm_inventory_qt.py Application/tests/test_winrm_display_trust_r104.py Application/tests/test_winrm_display_trust_qt_r104.py
          if ($LASTEXITCODE -ne 0) { throw 'R104 source compile failed' }
      - name: R105 WinRM enterprise CA validation (offline)
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_ca_bundle_r105.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R105 CA contract failed' }
          python -m py_compile Application/winrm_readonly.py Application/winrm_inventory_qt.py Application/tests/test_winrm_ca_bundle_qt_r105.py
          if ($LASTEXITCODE -ne 0) { throw 'R105 compile failed' }
      - name: R106 pin enterprise CA bytes before WinCred and WinRM network
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_ca_pinning_r106.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R106 CA trust pinning regression failed' }
          python -m py_compile Application/winrm_readonly.py Application/winrm_services_readonly.py Application/tests/test_winrm_ca_pinning_r106.py
          if ($LASTEXITCODE -ne 0) { throw 'R106 CA pinning source compilation failed' }
      - name: R107 private WinRM CA snapshot and cleanup gate
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_ca_snapshot_r107.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R107 CA snapshot failed' }
          python -m unittest discover -s Application/tests -p 'test_winrm_ca_bundle_r105.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R107 R105 compatibility failed' }
      - name: R108 protected Windows CA snapshot DACL and credential-order gate
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_snapshot_acl_r108.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R108 snapshot ACL contract failed' }
          python -m unittest discover -s Application/tests -p 'test_winrm_ca_snapshot_r107.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R108 R107 snapshot regression failed' }
          python -m py_compile Application/winrm_readonly.py Application/winrm_services_readonly.py Application/tests/test_winrm_snapshot_acl_r108.py Application/tests/test_winrm_ca_snapshot_r107.py
          if ($LASTEXITCODE -ne 0) { throw 'R108 source compilation failed' }
      - name: R109 Zabbix read-only API boundary and source compilation
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_zabbix_readonly_r109.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R109 Zabbix API contract failed' }
          python -m py_compile Application/zabbix_readonly.py Application/zabbix_alerts_qt.py Application/tests/test_zabbix_readonly_r109.py Application/tests/test_zabbix_alerts_qt_r109.py Application/tests/capture_zabbix_qt_r109.py Application/qt_app.py
          if ($LASTEXITCODE -ne 0) { throw 'R109 Zabbix source compilation failed' }
      - name: R110 Zabbix consent-binding source compilation
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m py_compile Application/zabbix_alerts_qt.py Application/tests/test_zabbix_consent_binding_r110.py Application/tests/capture_zabbix_consent_r110.py Application/qt_app.py
          if ($LASTEXITCODE -ne 0) { throw 'R110 Zabbix consent-binding compilation failed' }
      - name: R111 Zabbix response deadline source and unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_zabbix_response_deadline_r111.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R111 Zabbix response deadline tests failed' }
          python -m py_compile Application/zabbix_readonly.py Application/tests/test_zabbix_response_deadline_r111.py
          if ($LASTEXITCODE -ne 0) { throw 'R111 Zabbix response deadline compilation failed' }
      - name: Install ephemeral TLS fixture dependency for R112 tests
        shell: pwsh
        run: |
          python -m pip install "cryptography>=41,<47"
          if ($LASTEXITCODE -ne 0) { throw 'R112/R113 ephemeral TLS fixture dependency installation failed' }
      - name: R112 full Zabbix HTTPS transaction deadline
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_zabbix_transaction_deadline_r112.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R112 Zabbix transaction deadline tests failed' }
          python -m py_compile Application/zabbix_readonly.py Application/tests/test_zabbix_transaction_deadline_r112.py
          if ($LASTEXITCODE -ne 0) { throw 'R112 Zabbix transaction deadline compilation failed' }
      - name: R113 bounded Zabbix DNS deadline
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_zabbix_dns_deadline_r113.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R113 bounded DNS tests failed' }
          python -m py_compile Application/zabbix_readonly.py Application/tests/test_zabbix_dns_deadline_r113.py
          if ($LASTEXITCODE -ne 0) { throw 'R113 bounded DNS compilation failed' }
      - name: R100 native WinCred read, bounded blobs and cleanup
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_windows_credentials_native_r100.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R100 native WinCred gate failed" }
          python -m unittest discover -s Application/tests -p 'test_windows_credentials_v252.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Legacy WinCred gate failed" }
      - name: R104 source archive manifest reconciliation and verifier regression
        run: |
          $env:PYTHONPATH = '02-Compilation'
          python -m unittest discover -s 02-Compilation -p 'test_archive*manifest*r104.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R104 source archive manifest gate failed' }
          python -m unittest discover -s 02-Compilation -p 'test_archive_ui_capture_r110.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R110 cumulative UI evidence gate failed' }
          python -m py_compile 02-Compilation/build_cumulative_v318.py 02-Compilation/verify_cumulative_v318.py 02-Compilation/test_archive_ui_capture_r110.py 02-Compilation/generate_release_dossier.py
          if ($LASTEXITCODE -ne 0) { throw 'R104 release scripts compilation failed' }
      - name: Compile verifier sources
        shell: pwsh
        run: |
          python -m py_compile 02-Compilation/verify_cumulative_v318.py 04-Tests-et-Qualification/test_verify_cumulative_v318.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-native-build:
    runs-on: windows-latest
    needs: archive-verifier
    timeout-minutes: 90
    steps:
      - name: Preserve checkout bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure UTF-8 for legacy tests and build tools
        shell: pwsh
        run: |
          'PYTHONUTF8=1' >> $env:GITHUB_ENV
          'PYTHONIOENCODING=utf-8' >> $env:GITHUB_ENV
          'PY_PYTHON=3.12' >> $env:GITHUB_ENV
          'PY_PYTHON3=3.12' >> $env:GITHUB_ENV
      - name: Record source revision
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Binary/Qualification | Out-Null
          @"
          source_commit=$env:GITHUB_SHA
          run_id=$env:GITHUB_RUN_ID
          version=$(Get-Content VERSION.txt -Raw)
          "@ | Set-Content Binary/Qualification/build-provenance.txt
      - name: Generate required Word and PDF release dossier
        shell: pwsh
        run: |
          python -m pip install python-docx reportlab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python 02-Compilation/generate_release_dossier.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Refresh and validate source integrity manifest
        shell: pwsh
        run: |
          python 02-Compilation/refresh_source_manifest_v318.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python VERIFY-RELEASE.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute official Windows build entry point
        shell: cmd
        run: call 02-Compilation\BUILD-WINDOWS.cmd
      - name: R110 run Qt consent tests and generate required offline UI evidence
        shell: pwsh
        run: |
          $python = 'Application/.venv-build/Scripts/python.exe'
          if (!(Test-Path $python)) { throw 'Missing built Windows Python runtime for Qt evidence' }
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & $python -m unittest discover -s Application/tests -p 'test_zabbix_consent_binding_r110.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R110 Zabbix Qt consent tests failed in cumulative build' }
          & $python Application/tests/capture_zabbix_qt_r109.py
          if ($LASTEXITCODE -ne 0) { throw 'R109 offline Qt screenshot failed in cumulative build' }
          & $python Application/tests/capture_zabbix_consent_r110.py
          if ($LASTEXITCODE -ne 0) { throw 'R110 offline Qt screenshot failed in cumulative build' }
          foreach ($name in @('qt-zabbix-r109-offline.png', 'qt-zabbix-r110-consent-revoked.png')) {
            $file = Join-Path 'Binary/Qualification' $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 128) { throw "Required Qt evidence missing or too small: $name" }
          }
      - name: Assemble and verify cumulative ZIP
        shell: pwsh
        run: |
          python 02-Compilation/build_cumulative_v318.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = 'Binary/OpenRemote-Studio-V31.8-Windows-Cumulative.zip'
          python 02-Compilation/verify_cumulative_v318.py $zip --expected-commit (git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload cumulative ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openremote-v318-cumulative
          path: Binary/OpenRemote-Studio-V31.8-Windows-Cumulative.zip
          if-no-files-found: error
      - name: Upload Windows build output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v318-windows-build-evidence
          path: |
            Binary/**
          if-no-files-found: warn
