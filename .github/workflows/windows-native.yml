          if (!(Test-Path 'Binary/Qualification/qt-zabbix-r110-consent-revoked.png')) { throw 'Missing R110 consent-revocation capture' }
      - name: R111 Zabbix response-body deadline regression
        run: |
          $env:PYTHONPATH = 'Application'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_zabbix_response_deadline_r111.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R111 Zabbix response deadline tests failed' }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/zabbix_readonly.py Application/tests/test_zabbix_response_deadline_r111.py
          if ($LASTEXITCODE -ne 0) { throw 'R111 Zabbix response deadline compilation failed' }
      - name: R112 full Zabbix HTTPS transaction deadline
        run: |
          $env:PYTHONPATH = 'Application'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_zabbix_transaction_deadline_r112.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R112 Zabbix transaction deadline tests failed' }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/zabbix_readonly.py Application/tests/test_zabbix_transaction_deadline_r112.py
          if ($LASTEXITCODE -ne 0) { throw 'R112 Zabbix transaction deadline compilation failed' }
      - name: R113 bounded system DNS deadline
        run: |
          $env:PYTHONPATH = 'Application'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_zabbix_dns_deadline_r113.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R113 bounded DNS deadline tests failed' }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/zabbix_readonly.py Application/tests/test_zabbix_dns_deadline_r113.py
          if ($LASTEXITCODE -ne 0) { throw 'R113 bounded DNS compilation failed' }
      - name: R115 Grafana origin validation and R114 Qt panel qualification
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_grafana_readonly_r114.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R114 Grafana API contract tests failed' }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_grafana_dashboard_qt_r114.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R114 Grafana Qt tests failed' }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/grafana_readonly.py Application/grafana_dashboard_qt.py Application/qt_app.py Application/tests/test_grafana_readonly_r114.py Application/tests/test_grafana_dashboard_qt_r114.py Application/tests/capture_grafana_qt_r114.py
          if ($LASTEXITCODE -ne 0) { throw 'R114 Grafana source compilation failed' }
          & Application/.venv-build/Scripts/python.exe Application/tests/capture_grafana_qt_r114.py
          if ($LASTEXITCODE -ne 0) { throw 'R114 offline Grafana UI capture failed' }
          if (!(Test-Path 'Binary/Qualification/qt-grafana-r114-offline.png')) { throw 'Missing R114 offline Grafana capture' }
      - name: R116/R118 Ansible preflight, trust-file ACL and Qt consent regression
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_ansible_preflight_r116.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R116 Ansible static preflight tests failed' }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_ansible_preflight_qt_r116.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R116 Ansible Qt tests failed' }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/ansible_preflight.py Application/ansible_preflight_qt.py Application/qt_app.py Application/tests/test_ansible_preflight_r116.py Application/tests/test_ansible_preflight_qt_r116.py Application/tests/capture_ansible_preflight_qt_r116.py
          if ($LASTEXITCODE -ne 0) { throw 'R116 Ansible sources failed compilation' }
          & Application/.venv-build/Scripts/python.exe Application/tests/capture_ansible_preflight_qt_r116.py
          if ($LASTEXITCODE -ne 0) { throw 'R116 offline Ansible UI capture failed' }
          $capture = Get-Item 'Binary/Qualification/ansible-preflight-r116.png' -ErrorAction Stop
          if ($capture.Length -lt 128) { throw 'R116 offline Ansible screenshot is too small' }
      - name: R115 packaged GUI smoke timeout and redaction contract
        run: |
          $env:PYTHONPATH = 'Application'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_packaged_smoke_diagnostics_r115.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R115 packaged GUI smoke evidence contract failed' }
      - name: R122 build environment report version contract
        run: |
          python -m unittest discover -s Application/tests -p 'test_build_environment_report_r122.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R122 build report version tests failed' }
          python -m py_compile Application/tests/test_build_environment_report_r122.py
          if ($LASTEXITCODE -ne 0) { throw 'R122 test compilation failed' }
      - name: R123 SFTP cancellation outcome and resource cleanup
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_sftp_job_outcome_r123.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R123 SFTP worker outcome tests failed' }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_transfer_queue.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R123 transfer queue cancellation tests failed' }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/qt_workers.py Application/transfer_queue.py Application/qt_app.py Application/tests/test_sftp_job_outcome_r123.py
          if ($LASTEXITCODE -ne 0) { throw 'R123 SFTP source compilation failed' }
      - name: R100 native WinCred session-only round trip and bounded secret checks
        run: |
          $env:PYTHONPATH = 'Application'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_windows_credentials_native_r100.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R100 native WinCred gate failed" }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_windows_credentials_v252.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Legacy WinCred regression failed" }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/windows_credentials.py
          if ($LASTEXITCODE -ne 0) { throw "R100 WinCred compilation failed" }
      - name: Verify native artifacts exist
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $base = Join-Path 'Binary' "V$version"
          $installer = Join-Path $base "Installer/OpenRemoteStudio-V$version-Windows-Setup.exe"
          $portable = Join-Path $base "Portable/OpenRemoteStudio-V$version-Windows-Portable.zip"
          foreach ($path in @($installer, $portable)) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing binary: $path" }
            if ((Get-Item -LiteralPath $path).Length -lt 1024) { throw "Suspiciously small binary: $path" }
            Get-FileHash -LiteralPath $path -Algorithm SHA256 | Format-List
          }
      - name: Audit installed packaging dependencies
        run: |
          & Application/.venv-build/Scripts/python.exe 02-Compilation/check_build_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw "Build dependency audit failed" }
          & Application/.venv-build/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Python dependency conflicts detected" }
      - name: Validate PE and portable ZIP structure
        run: |
          python 02-Compilation/verify_ci_artifacts.py
          if ($LASTEXITCODE -ne 0) { throw "Artifact verification failed" }
      - name: Validate portable without source tree
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $zip = Join-Path 'Binary' "V$version/Portable/OpenRemoteStudio-V$version-Windows-Portable.zip"
          $isolated = Join-Path $env:RUNNER_TEMP "ors-independent-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $isolated -ErrorAction Stop
          $executables = @(Get-ChildItem -LiteralPath $isolated -Recurse -Filter OpenRemoteStudio.exe -File)
          if ($executables.Count -ne 1) { throw "Portable must contain exactly one application executable" }
          $exe = $executables[0].FullName
          $oldPath = $env:PYTHONPATH
          $env:PYTHONPATH = ''
          try {
            $smoke = (Resolve-Path 'Application/windows/smoke-windows.ps1').Path
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $smoke -Exe $exe -TimeoutSeconds 60
            if ($LASTEXITCODE -ne 0) { throw "Isolated portable GUI smoke failed" }
          } finally {
            $env:PYTHONPATH = $oldPath
          }
      - name: Audit independent distribution dependencies
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $zip = Join-Path 'Binary' "V$version/Portable/OpenRemoteStudio-V$version-Windows-Portable.zip"
          $auditDir = Join-Path $env:RUNNER_TEMP "ors-dependency-audit"
          New-Item -ItemType Directory -Path $auditDir -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $auditDir -Force
          $exe = @(Get-ChildItem $auditDir -Filter OpenRemoteStudio.exe -File -Recurse)
          if ($exe.Count -ne 1) { throw "Missing packaged executable" }
          $root = $exe[0].Directory.FullName
          $pythonDll = @(Get-ChildItem $root -Recurse -Filter 'python3*.dll' -File)
          $qtPlugin = @(Get-ChildItem $root -Recurse -Filter 'qwindows.dll' -File)
          if ($pythonDll.Count -lt 1) { throw "Portable distribution lacks Python runtime DLL" }
          if ($qtPlugin.Count -ne 1) { throw "Portable distribution lacks a unique Qt platform plugin" }
          Write-Host "PASS: embedded Python runtime and Qt Windows platform plugin"
      - name: Upload build and qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openremote-windows-build-logs
          path: |
            Binary/*.log
            Binary/Qualification/**
            04-Qualification/**
          if-no-files-found: warn
      - name: Upload Windows binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openremote-windows-native-candidate
          path: |
            Binary/V*/Installer/*.exe
            Binary/V*/Portable/*.zip
          if-no-files-found: error
