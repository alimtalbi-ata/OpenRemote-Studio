      - name: R109 Zabbix Qt panel, backend regressions and offline capture
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_zabbix_readonly_r109.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R109 Zabbix backend tests failed' }
