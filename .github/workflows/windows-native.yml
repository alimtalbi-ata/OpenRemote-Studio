name: Windows native build candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Application/**'
      - '02-Compilation/**'
      - 'VERSION.txt'
      - '.github/workflows/windows-native.yml'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve repository bytes on Windows
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R70 verify exact PR source SHA and PyInstaller specs
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Wrong source commit: $actual != $expected" }
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_packaging_spec_paths_r70.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_ssh_identity_r77.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_lifecycle_r72.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_revocation_r78.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_close_barrier_r79.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_drain_r80.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_shutdown_r81.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_controller_r82.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_qt_r82.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_health_r83.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_health_qt_r83.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_tunnel_watchdog_r84.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_netbox_readonly_r73.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_netbox_preview_r74.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_netbox_filter_r75.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Application/tests -p 'test_netbox_cancel_r76.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile Application/netbox_readonly.py Application/netbox_preview_filter.py Application/netbox_preview_qt.py Application/qt_app.py Application/tests/test_netbox_cancel_r76.py Application/tests/test_netbox_cancel_qt_r76.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R101 packaged WinRM runtime and spec path regressions
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_runtime_r101.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R101 packaged runtime contract failed" }
      - name: R102 strict WinRM response parsing and secret redaction
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_response_r102.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R102 strict WinRM response contract failed" }
      - name: R103 WinRM hostile exception and Qt signal boundary
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_exception_boundary*r103.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R103 WinRM boundary failed' }
      - name: R104 WinRM Unicode spoofing and Qt display trust pure tests
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_display_trust_r104.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R104 pure WinRM display trust failed' }
      - name: R104 source archive manifest reconciliation and verifier regression
        run: |
          $env:PYTHONPATH = '02-Compilation'
          python -m unittest discover -s 02-Compilation -p 'test_archive*manifest*r104.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R104 source archive manifest gate failed' }
          python -m py_compile 02-Compilation/build_cumulative_v318.py 02-Compilation/verify_cumulative_v318.py
          if ($LASTEXITCODE -ne 0) { throw 'R104 release scripts compilation failed' }
      - name: R93 WinRM read-only offline and redaction regression
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_readonly_r93.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R93 WinRM unit gate failed" }
          python -m py_compile Application/winrm_readonly.py Application/tests/test_winrm_readonly_r93.py
          if ($LASTEXITCODE -ne 0) { throw "R93 WinRM source compile failed" }
      - name: R94 WinRM pywinrm timeout safety regression
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_timeout_r94.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R94 WinRM timeout contract failed" }
          python -m unittest discover -s Application/tests -p 'test_network_scope_empty_close_r94.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R94 empty-scope shutdown regression failed" }
          python -m py_compile Application/winrm_inventory_qt.py Application/tests/test_winrm_inventory_qt_r94.py
          if ($LASTEXITCODE -ne 0) { throw "R94 Qt source compilation failed" }
      - name: Enforce UTF-8 and Python 3.12 for legacy tests
        run: |
          "PYTHONUTF8=1" >> $env:GITHUB_ENV
          "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV
          "PY_PYTHON=3.12" >> $env:GITHUB_ENV
          "PY_PYTHON3=3.12" >> $env:GITHUB_ENV
      - name: Generate versioned release documentation
        run: |
          python -m pip install python-docx reportlab
          if ($LASTEXITCODE -ne 0) { throw "Documentation dependencies failed" }
          python 02-Compilation/generate_release_dossier.py
          if ($LASTEXITCODE -ne 0) { throw "Documentation generation failed" }
      - name: Validate checked-out source and refresh CI integrity manifest
        run: |
          $changed = @(git diff --name-only --exit-code)
          if ($LASTEXITCODE -ne 0) { throw "Checkout has modified tracked files" }
          @'
          from pathlib import Path
          import hashlib
          import subprocess
          root = Path.cwd()
          names = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          manifest = Path("07-Manifestes/FILES-SHA256.txt")
          names = sorted(set(name for name in names if name and name != manifest.as_posix()) | {str(p.as_posix()) for p in Path("05-Documentation").glob("Dossier-V*") if p.suffix in (".docx", ".pdf")})
          manifest.write_text("".join(hashlib.sha256((root / name).read_bytes()).hexdigest() + "  " + name + "\n" for name in names), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare CI integrity manifest" }
          python VERIFY-RELEASE.py
          if ($LASTEXITCODE -ne 0) { throw "Source integrity check failed" }
      - name: Regression tests for artifact gates
        run: |
          python -m unittest discover -s 02-Compilation -p 'test_verify_ci_artifacts.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Artifact gate tests failed" }
      - name: Static architecture audit
        run: |
          python -m unittest discover -s 02-Compilation -p 'test_audit_architecture.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Architecture inventory tests failed" }
          python 02-Compilation/audit_architecture.py --root . --output Binary/Qualification/architecture-inventory.json
          if ($LASTEXITCODE -ne 0) { throw "Architecture inventory failed" }
      - name: Parse all PowerShell build scripts before packaging
        run: |
          $scripts = @(Get-ChildItem Application/windows, 02-Compilation -Filter '*.ps1' -File -Recurse)
          $failed = $false
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Host "PARSER ERROR: $($script.FullName):$($parseError.Extent.StartLineNumber) $($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell build scripts contain syntax errors" }
          Write-Host "PowerShell syntax PASS: $($scripts.Count) scripts"
      - name: Build and run complete native qualification
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $script = Join-Path '02-Compilation' "QUALIFICATION-NATIVE-V$version.ps1"
          if (!(Test-Path -LiteralPath $script -PathType Leaf)) { throw "Missing native qualification script: $script" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Build
          if ($LASTEXITCODE -ne 0) { throw "Native qualification failed: $LASTEXITCODE" }
      - name: R88 Qt cleanup barrier and readable glyph screenshot gate
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_tunnel_cleanup_barrier_qt_r88.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R88 Qt cleanup barrier failed" }
          & Application/.venv-build/Scripts/python.exe Application/tests/capture_tunnel_qt_r83.py
          if ($LASTEXITCODE -ne 0) { throw "R88 Qt glyph raster gate failed" }
          if (!(Test-Path 'Binary/Qualification/qt-tunnel-r88-offline.png')) { throw "Missing readable Qt render" }
      - name: R89 Qt redacted failure guidance and typed SSH error classification
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_tunnel_failure_guidance_qt_r89.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R89 Qt failure guidance failed" }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_tunnel_failure_classification_r89.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R89 typed SSH error classification failed" }
      - name: R90 SSH consent revision and Qt invalidation regressions
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_ssh_consent_guard_r90.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R90 consent guard failed" }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_ssh_consent_qt_r90.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R90 Qt consent regression failed" }
      - name: R91 Qt consent withdrawal closes active SSH tunnels
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_ssh_consent_revocation_qt_r91.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R91 Qt consent revocation failed" }
      - name: R92 bounded SSH response probe and Qt consent regressions
        run: |
          $env:PYTHONPATH = 'Application;Application/tests'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_tunnel_probe_r92.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R92 bounded probe tests failed" }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_tunnel_probe_qt_r92.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R92 Qt probe consent tests failed" }
      - name: R94 WinRM Qt opt-in, stale response and secret redaction
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_inventory_qt_r94.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R94 WinRM Qt contract failed" }
          & Application/.venv-build/Scripts/python.exe Application/tests/capture_winrm_qt_r94.py
          if ($LASTEXITCODE -ne 0) { throw "R94 offline WinRM Qt capture failed" }
          if (!(Test-Path 'Binary/Qualification/qt-winrm-r94-offline.png')) { throw "Missing R94 Qt capture" }
      - name: R96 WinRM services backend and Qt offline filtering
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_services_r95.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R95 services backend contract failed" }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_services_qt_r96.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R96 services Qt contract failed" }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/winrm_inventory_qt.py Application/qt_app.py Application/tests/test_winrm_services_qt_r96.py
          if ($LASTEXITCODE -ne 0) { throw "R96 WinRM Qt source compile failed" }
          & Application/.venv-build/Scripts/python.exe Application/tests/capture_winrm_services_qt_r96.py
          if ($LASTEXITCODE -ne 0) { throw "R96 services Qt offline screenshot failed" }
          if (!(Test-Path 'Binary/Qualification/qt-winrm-services-r96-offline.png')) { throw "Missing R96 Qt screenshot" }
      - name: R98 WinRM service drift and Qt consent regressions
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_service_drift_r98.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R98 drift pure tests failed" }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_service_drift_qt_r98.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R98 drift Qt tests failed" }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/winrm_service_drift.py Application/winrm_inventory_qt.py
          if ($LASTEXITCODE -ne 0) { throw "R98 source compilation failed" }
      - name: R99 WinCred reference worker, consent and redaction tests
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_credential_ref_r99.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R99 WinCred pure tests failed" }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_credential_ref_qt_r99.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R99 WinCred Qt tests failed" }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/winrm_credential_ref.py Application/winrm_inventory_qt.py
          if ($LASTEXITCODE -ne 0) { throw "R99 WinCred compilation failed" }
      - name: R104 Qt reject spoofed WinRM service, OS and disk data
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_display_trust_qt_r104.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R104 Qt WinRM display trust failed' }
      - name: R105 enterprise CA WinRM Qt and backend qualification
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_ca_bundle_r105.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R105 backend failed' }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_winrm_ca_bundle_qt_r105.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R105 Qt failed' }
          & Application/.venv-build/Scripts/python.exe Application/tests/capture_winrm_ca_qt_r105.py
          if ($LASTEXITCODE -ne 0) { throw 'R105 offline screenshot failed' }
          if (!(Test-Path 'Binary/Qualification/qt-winrm-ca-r105-offline.png')) { throw 'Missing R105 Qt capture' }
      - name: R106 pin enterprise CA bytes before WinCred and WinRM network
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_ca_pinning_r106.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R106 CA trust pinning regression failed' }
          python -m py_compile Application/winrm_readonly.py Application/winrm_services_readonly.py Application/tests/test_winrm_ca_pinning_r106.py
          if ($LASTEXITCODE -ne 0) { throw 'R106 CA pinning source compilation failed' }
      - name: R107 private WinRM CA snapshot and cleanup gate
        run: |
          $env:PYTHONPATH = 'Application'
          python -m unittest discover -s Application/tests -p 'test_winrm_ca_snapshot_r107.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R107 private CA snapshot failed' }
          python -m unittest discover -s Application/tests -p 'test_winrm_ca_bundle_r105.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R107 R105 compatibility failed' }
          python -m py_compile Application/winrm_readonly.py Application/winrm_services_readonly.py Application/tests/test_winrm_ca_snapshot_r107.py
          if ($LASTEXITCODE -ne 0) { throw 'R107 compilation failed' }
      - name: R100 native WinCred session-only round trip and bounded secret checks
        run: |
          $env:PYTHONPATH = 'Application'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_windows_credentials_native_r100.py' -v
          if ($LASTEXITCODE -ne 0) { throw "R100 native WinCred gate failed" }
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_windows_credentials_v252.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Legacy WinCred regression failed" }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/windows_credentials.py
          if ($LASTEXITCODE -ne 0) { throw "R100 WinCred compilation failed" }
      - name: Verify native artifacts exist
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $base = Join-Path 'Binary' "V$version"
          $installer = Join-Path $base "Installer/OpenRemoteStudio-V$version-Windows-Setup.exe"
          $portable = Join-Path $base "Portable/OpenRemoteStudio-V$version-Windows-Portable.zip"
          foreach ($path in @($installer, $portable)) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing binary: $path" }
            if ((Get-Item -LiteralPath $path).Length -lt 1024) { throw "Suspiciously small binary: $path" }
            Get-FileHash -LiteralPath $path -Algorithm SHA256 | Format-List
          }
      - name: Audit installed packaging dependencies
        run: |
          & Application/.venv-build/Scripts/python.exe 02-Compilation/check_build_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw "Build dependency audit failed" }
          & Application/.venv-build/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Python dependency conflicts detected" }
      - name: Validate PE and portable ZIP structure
        run: |
          python 02-Compilation/verify_ci_artifacts.py
          if ($LASTEXITCODE -ne 0) { throw "Artifact verification failed" }
      - name: Validate portable without source tree
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $zip = Join-Path 'Binary' "V$version/Portable/OpenRemoteStudio-V$version-Windows-Portable.zip"
          $isolated = Join-Path $env:RUNNER_TEMP "ors-independent-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $isolated -ErrorAction Stop
          $executables = @(Get-ChildItem -LiteralPath $isolated -Recurse -Filter OpenRemoteStudio.exe -File)
          if ($executables.Count -ne 1) { throw "Portable must contain exactly one application executable" }
          $exe = $executables[0].FullName
          $oldPath = $env:PYTHONPATH
          $env:PYTHONPATH = ''
          try {
            $smoke = (Resolve-Path 'Application/windows/smoke-windows.ps1').Path
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $smoke -Exe $exe -TimeoutSeconds 30
            if ($LASTEXITCODE -ne 0) { throw "Isolated portable GUI smoke failed" }
          } finally {
            $env:PYTHONPATH = $oldPath
          }
      - name: Audit independent distribution dependencies
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $zip = Join-Path 'Binary' "V$version/Portable/OpenRemoteStudio-V$version-Windows-Portable.zip"
          $auditDir = Join-Path $env:RUNNER_TEMP "ors-dependency-audit"
          New-Item -ItemType Directory -Path $auditDir -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $auditDir -Force
          $exe = @(Get-ChildItem $auditDir -Filter OpenRemoteStudio.exe -File -Recurse)
          if ($exe.Count -ne 1) { throw "Missing packaged executable" }
          $root = $exe[0].Directory.FullName
          $pythonDll = @(Get-ChildItem $root -Recurse -Filter 'python3*.dll' -File)
          $qtPlugin = @(Get-ChildItem $root -Recurse -Filter 'qwindows.dll' -File)
          if ($pythonDll.Count -lt 1) { throw "Portable distribution lacks Python runtime DLL" }
          if ($qtPlugin.Count -ne 1) { throw "Portable distribution lacks a unique Qt platform plugin" }
          Write-Host "PASS: embedded Python runtime and Qt Windows platform plugin"
      - name: Upload build and qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openremote-windows-build-logs
          path: |
            Binary/*.log
            Binary/Qualification/**
            04-Qualification/**
          if-no-files-found: warn
      - name: Upload Windows binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openremote-windows-native-candidate
          path: |
            Binary/V*/Installer/*.exe
            Binary/V*/Portable/*.zip
          if-no-files-found: error
