          if ($LASTEXITCODE -ne 0) { throw 'R109 Zabbix Qt tests failed' }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/zabbix_readonly.py Application/zabbix_alerts_qt.py Application/qt_app.py Application/tests/test_zabbix_readonly_r109.py Application/tests/test_zabbix_alerts_qt_r109.py
          if ($LASTEXITCODE -ne 0) { throw 'R109 Zabbix compilation failed' }
          & Application/.venv-build/Scripts/python.exe Application/tests/capture_zabbix_qt_r109.py
          if ($LASTEXITCODE -ne 0) { throw 'R109 offline UI capture failed' }
          if (!(Test-Path 'Binary/Qualification/qt-zabbix-r109-offline.png')) { throw 'Missing R109 offline Qt capture' }
      - name: R110 Zabbix origin-bound consent and offline capture
        run: |
          $env:PYTHONPATH = 'Application'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s Application/tests -p 'test_zabbix_consent_binding_r110.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R110 Zabbix consent binding tests failed' }
          & Application/.venv-build/Scripts/python.exe -m py_compile Application/zabbix_alerts_qt.py Application/tests/test_zabbix_consent_binding_r110.py Application/tests/capture_zabbix_consent_r110.py Application/qt_app.py
          & Application/.venv-build/Scripts/python.exe -m unittest discover -s 02-Compilation -p 'test_archive_ui_capture_r110.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R110 cumulative UI evidence helper tests failed' }
          if ($LASTEXITCODE -ne 0) { throw 'R110 Zabbix consent source compilation failed' }
          & Application/.venv-build/Scripts/python.exe Application/tests/capture_zabbix_consent_r110.py
