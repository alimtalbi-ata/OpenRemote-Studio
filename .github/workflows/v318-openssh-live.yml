name: SFTP OpenSSH live integration
on:
  push:
    branches: [develop/v31.8-windows-ci, feature/v31.8-r78-tunnel-active-revocation, feature/v31.8-r79-tunnel-close-barrier, feature/v31.8-r80-tunnel-drain-hostkey-rotation, feature/v31.8-r81-tunnel-ui-shutdown, feature/v31.8-r82-qt-tunnel-panel, feature/v31.8-r83-ssh-link-health, feature/v31.8-r84-headless-ssh-watchdog, feature/v31.8-r87-manual-ssh-retry, feature/v31.8-r89-ssh-failure-guidance-live-retry, feature/v31.8-r90-ssh-consent-binding-live-qt, feature/v31.8-r91-consent-revocation, feature/v31.8-r92-bounded-ssh-probe, feature/v31.8-r93-winrm-readonly-inventory, feature/v31.8-r94-winrm-timeout-qt-preview, feature/v31.8-r95-winrm-services-readonly, feature/v31.8-r97-winrm-service-precise-count, feature/v31.8-r98-winrm-service-drift, feature/v31.8-r99-winrm-wincred-reference, feature/v31.8-r100-wincred-native-boundaries, feature/v31.8-r101-winrm-packaged-runtime, feature/v31.8-r102-winrm-strict-response, feature/v31.8-r103-winrm-exception-boundaries, feature/v31.8-r104-winrm-display-trust, feature/v31.8-r105-winrm-enterprise-ca, feature/v31.8-r106-winrm-ca-pinning, feature/v31.8-r107-winrm-ca-snapshot, feature/v31.8-r108-winrm-ca-acl, feature/v31.8-r109-zabbix-readonly-alerts, feature/v31.8-r110-zabbix-origin-consent]
  pull_request:
    branches: [main, develop/v31.8-windows-ci, feature/v31.8-r76-netbox-revocation, feature/v31.8-r77-openssh-hostkey-validation, feature/v31.8-r78-tunnel-active-revocation, feature/v31.8-r79-tunnel-close-barrier, feature/v31.8-r80-tunnel-drain-hostkey-rotation, feature/v31.8-r81-tunnel-ui-shutdown, feature/v31.8-r82-qt-tunnel-panel, feature/v31.8-r83-ssh-link-health, feature/v31.8-r86-qt-ssh-keepalive, feature/v31.8-r87-manual-ssh-retry, feature/v31.8-r88-qt-font-render-gate, feature/v31.8-r89-ssh-failure-guidance-live-retry, feature/v31.8-r91-consent-revocation, feature/v31.8-r92-bounded-ssh-probe, feature/v31.8-r93-winrm-readonly-inventory, feature/v31.8-r95-winrm-services-readonly, feature/v31.8-r96-winrm-services-qt-filter, feature/v31.8-r97-winrm-service-precise-count, feature/v31.8-r98-winrm-service-drift, feature/v31.8-r99-winrm-wincred-reference, feature/v31.8-r100-wincred-native-boundaries, feature/v31.8-r105-winrm-enterprise-ca, feature/v31.8-r107-winrm-ca-snapshot, feature/v31.8-r108-winrm-ca-acl, feature/v31.8-r109-zabbix-readonly-alerts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  openssh-sftp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R70 verify exact source SHA and wbx regression (unit fakes)
        env:
          PYTHONPATH: Application
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m unittest discover -s Application/tests -p 'test_upload_exclusive.py' -v
          python -m unittest discover -s Application/tests -p 'test_resume_lock_ownership_r71.py' -v
      - name: R103 hostile WinRM exceptions (offline regression)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_winrm_exception_boundary_r103.py' -v
      - name: R104 WinRM untrusted Unicode display regression (offline)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_winrm_display_trust_r104.py' -v
      - name: R105 WinRM CA PEM fail-closed (offline)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_winrm_ca_bundle_r105.py' -v
      - name: Start real OpenSSH SFTP server
        run: |
          docker run -d --name openremote-sftp -p 127.0.0.1:2222:22 atmoz/sftp tester:testpassword:::upload
          for i in $(seq 1 40); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/2222' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs openremote-sftp
          exit 1
      - name: Install Paramiko
        run: python -m pip install 'paramiko>=3.4,<5'
      - name: R78 allow TCP forwarding in disposable OpenSSH fixture
        run: |
          docker exec -u root openremote-sftp sh -c "sed -i -E 's/^[[:space:]]*AllowTcpForwarding[[:space:]]+no/AllowTcpForwarding yes/' /etc/ssh/sshd_config; sed -i -E 's/^[[:space:]]*DisableForwarding[[:space:]]+yes/DisableForwarding no/' /etc/ssh/sshd_config; /usr/sbin/sshd -t"
          docker restart openremote-sftp
          for i in $(seq 1 40); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/2222' 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec -u root openremote-sftp /usr/sbin/sshd -T -C user=tester,host=localhost,addr=127.0.0.1 | grep -Eq '^allowtcpforwarding (yes|local)$'
      - name: R109 Zabbix read-only API boundary (synthetic transport)
        shell: bash
        run: |
          export PYTHONPATH=Application
          python -m unittest discover -s Application/tests -p 'test_zabbix_readonly_r109.py' -v
      - name: R110 Zabbix consent-binding source compilation
        env:
          PYTHONPATH: Application
        run: python -m py_compile Application/zabbix_alerts_qt.py Application/tests/test_zabbix_consent_binding_r110.py Application/tests/capture_zabbix_consent_r110.py Application/qt_app.py
      - name: R102 WinRM strict response contract (offline, no Windows Server)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_winrm_response_r102.py' -v
      - name: R77 live SSH host-key pinning and fail-closed negatives
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_hostkey_r77.py
      - name: R78 live SSH direct-tcpip forwarding and active revocation
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_r78.py
      - name: R79 real SSH forwarding with concurrent close barrier
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_r79.py
      - name: Execute live SFTP transfer scenarios
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_sftp_openssh_v318.py
      - name: R80 local SSH tunnel drain regressions (fake channels)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_drain_r80.py' -v
      - name: R81 listener-close/drain ordering and UI status (local loopback, fake SSH)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_shutdown_r81.py' -v
      - name: R82 generate ephemeral key and authorize disposable OpenSSH fixture
        run: |
          mkdir -p "$RUNNER_TEMP/ors-r82"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ors-r82/key"
          docker cp "$RUNNER_TEMP/ors-r82/key.pub" openremote-sftp:/tmp/ors-r82-key.pub
          docker exec -u root openremote-sftp sh -c 'mkdir -p /home/tester/.ssh && cat /tmp/ors-r82-key.pub >> /home/tester/.ssh/authorized_keys && chown -R tester:users /home/tester/.ssh && chmod 700 /home/tester/.ssh && chmod 600 /home/tester/.ssh/authorized_keys'
          echo "R82_SSH_KEY_PATH=$RUNNER_TEMP/ors-r82/key" >> "$GITHUB_ENV"
      - name: R82 real key-only Qt tunnel backend and wrong-pin refusal
        env:
          PYTHONPATH: Application:Application/tests
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_controller_r82.py
      - name: R82 controller races and cancellation (real loopback sockets)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_controller_r82.py' -v
      - name: R83 SSH link-loss revocation regressions (real loopback, simulated transport)
        env:
          PYTHONPATH: Application:Application/tests
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_health_r83.py' -v
      - name: R83 real OpenSSH transport loss revokes local tunnel
        env:
          PYTHONPATH: Application:Application/tests
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_health_r83.py
      - name: R84 headless watchdog regressions (real loopback, fake SSH)
        env:
          PYTHONPATH: Application:Application/tests
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_watchdog_r84.py' -v
      - name: R84 real OpenSSH loss without Qt polling
        env:
          PYTHONPATH: Application:Application/tests
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_watchdog_r84.py
      - name: R89 typed SSH failure redaction unit tests
        env:
          PYTHONPATH: Application:Application/tests
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_failure_classification_r89.py' -v
      - name: R89 real OpenSSH wrong pin, explicit retry and authentication denial
        env:
          PYTHONPATH: Application:Application/tests
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_retry_r89.py
      - name: R90 consent revision guard unit regressions
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_ssh_consent_guard_r90.py' -v
      - name: R90 install Qt offscreen runtime libraries (CI runner only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: R90 install Qt for offscreen integration (disposable fixture only)
        run: python -m pip install 'PySide6>=6.8,<7'
      - name: R90 real OpenSSH Qt click-through, fresh consent and live-edit revocation
        env:
          PYTHONPATH: Application:Application/tests
          QT_QPA_PLATFORM: offscreen
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_qt_r90.py
      - name: R91 real OpenSSH Qt consent withdrawal, listener revocation and manual reapproval
        env:
          PYTHONPATH: Application:Application/tests
          QT_QPA_PLATFORM: offscreen
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_qt_r91.py
      - name: R92 bounded SSH probe regressions (real loopback, synthetic SSH)
        env:
          PYTHONPATH: Application:Application/tests
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_probe_r92.py' -v
      - name: R92 disposable OpenSSH reply and paused-server probe revocation
        env:
          PYTHONPATH: Application:Application/tests
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_probe_r92.py
      - name: R92 Qt probe opt-in and fresh consent regressions
        env:
          PYTHONPATH: Application:Application/tests
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_probe_qt_r92.py' -v
      - name: R80 real host-key rotation fail-closed (disposable fixture only)
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_rotation_r80.py
      - name: R91 Qt consent revocation regressions (no external network)
        env:
          PYTHONPATH: Application
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s Application/tests -p 'test_ssh_consent_revocation_qt_r91.py' -v
      - name: R94 WinRM offline, timeout and Qt consent regressions
        env:
          PYTHONPATH: Application
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s Application/tests -p 'test_winrm_timeout_r94.py' -v
          python -m unittest discover -s Application/tests -p 'test_network_scope_empty_close_r94.py' -v
          python -m unittest discover -s Application/tests -p 'test_winrm_inventory_qt_r94.py' -v
      - name: R98 local-only WinRM service drift contract (no WinRM server)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_winrm_service_drift_r98.py' -v
      - name: R99 WinCred offline reference contract (no Windows Server)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_winrm_credential_ref_r99.py' -v
      - name: Show OpenSSH server logs on failure
        if: failure()
        run: docker logs openremote-sftp || true
