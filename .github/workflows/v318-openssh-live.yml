name: SFTP OpenSSH live integration
on:
  push:
    branches: [develop/v31.8-windows-ci, feature/v31.8-r78-tunnel-active-revocation, feature/v31.8-r79-tunnel-close-barrier, feature/v31.8-r80-tunnel-drain-hostkey-rotation, feature/v31.8-r81-tunnel-ui-shutdown, feature/v31.8-r82-qt-tunnel-panel]
  pull_request:
    branches: [main, develop/v31.8-windows-ci, feature/v31.8-r76-netbox-revocation, feature/v31.8-r77-openssh-hostkey-validation, feature/v31.8-r78-tunnel-active-revocation, feature/v31.8-r79-tunnel-close-barrier, feature/v31.8-r80-tunnel-drain-hostkey-rotation, feature/v31.8-r81-tunnel-ui-shutdown]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  openssh-sftp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R70 verify exact source SHA and wbx regression (unit fakes)
        env:
          PYTHONPATH: Application
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m unittest discover -s Application/tests -p 'test_upload_exclusive.py' -v
          python -m unittest discover -s Application/tests -p 'test_resume_lock_ownership_r71.py' -v
      - name: Start real OpenSSH SFTP server
        run: |
          docker run -d --name openremote-sftp -p 127.0.0.1:2222:22 atmoz/sftp tester:testpassword:::upload
          for i in $(seq 1 40); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/2222' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs openremote-sftp
          exit 1
      - name: Install Paramiko
        run: python -m pip install 'paramiko>=3.4,<5'
      - name: R78 allow TCP forwarding in disposable OpenSSH fixture
        run: |
          docker exec -u root openremote-sftp sh -c "sed -i -E 's/^[[:space:]]*AllowTcpForwarding[[:space:]]+no/AllowTcpForwarding yes/' /etc/ssh/sshd_config; sed -i -E 's/^[[:space:]]*DisableForwarding[[:space:]]+yes/DisableForwarding no/' /etc/ssh/sshd_config; /usr/sbin/sshd -t"
          docker restart openremote-sftp
          for i in $(seq 1 40); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/2222' 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec -u root openremote-sftp /usr/sbin/sshd -T -C user=tester,host=localhost,addr=127.0.0.1 | grep -Eq '^allowtcpforwarding (yes|local)$'
      - name: R77 live SSH host-key pinning and fail-closed negatives
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_hostkey_r77.py
      - name: R78 live SSH direct-tcpip forwarding and active revocation
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_r78.py
      - name: R79 real SSH forwarding with concurrent close barrier
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_r79.py
      - name: Execute live SFTP transfer scenarios
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_sftp_openssh_v318.py
      - name: R80 local SSH tunnel drain regressions (fake channels)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_drain_r80.py' -v
      - name: R81 listener-close/drain ordering and UI status (local loopback, fake SSH)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_shutdown_r81.py' -v
      - name: R82 generate ephemeral key and authorize disposable OpenSSH fixture
        run: |
          mkdir -p "$RUNNER_TEMP/ors-r82"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ors-r82/key"
          docker cp "$RUNNER_TEMP/ors-r82/key.pub" openremote-sftp:/tmp/ors-r82-key.pub
          docker exec -u root openremote-sftp sh -c 'mkdir -p /home/tester/.ssh && cat /tmp/ors-r82-key.pub >> /home/tester/.ssh/authorized_keys && chown -R tester:users /home/tester/.ssh && chmod 700 /home/tester/.ssh && chmod 600 /home/tester/.ssh/authorized_keys'
          echo "R82_SSH_KEY_PATH=$RUNNER_TEMP/ors-r82/key" >> "$GITHUB_ENV"
      - name: R82 real key-only Qt tunnel backend and wrong-pin refusal
        env:
          PYTHONPATH: Application:Application/tests
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_tunnel_controller_r82.py
      - name: R82 controller races and cancellation (real loopback sockets)
        env:
          PYTHONPATH: Application
        run: python -m unittest discover -s Application/tests -p 'test_tunnel_controller_r82.py' -v
      - name: R80 real host-key rotation fail-closed (disposable fixture only)
        env:
          PYTHONPATH: Application
          SFTP_TEST_HOST: 127.0.0.1
          SFTP_TEST_PORT: '2222'
        run: python Application/tests/live_ssh_rotation_r80.py
      - name: Show OpenSSH server logs on failure
        if: failure()
        run: docker logs openremote-sftp || true
